services:
  - type: web
    name: my-tg-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7253874622"
      - key: WHITELIST_IDS
        value: "7253874622,7970653104"
      - key: SECRET_KEY
        sync: false
